<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Capybara Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#e8e8e8;

overflow:hidden;

transition:1s;

}


body.dark{

background:#111;

}


/* MENU COULEUR */

#menu{

position:absolute;

width:100%;
height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#87ceeb;

z-index:10;

}


#box{

background:white;

padding:30px;

border-radius:20px;

text-align:center;

}


#box h1{

margin-bottom:20px;

}


button{

padding:12px 20px;

margin:8px;

border:0;

border-radius:10px;

cursor:pointer;

font-size:18px;

}



/* JEU */


#game{

display:none;

width:900px;

height:350px;

margin:40px auto;

background:linear-gradient(#87ceeb,#eee);

border:3px solid #333;

border-radius:15px;

position:relative;

overflow:hidden;

}
#game::before{

content:"";

position:absolute;

bottom:40px;

left:0;

width:200%;

height:120px;

background:linear-gradient(transparent,#9acd32);

animation:paysage 8s linear infinite;

z-index:0;

}


@keyframes paysage{

from{

transform:translateX(0);

}

to{

transform:translateX(-50%);

}

}


.dark #game{

background:linear-gradient(#111,#333);

border-color:white;

}



/* SCORE */


#score{

position:absolute;

right:20px;

top:15px;

font-size:24px;

font-weight:bold;

}



/* SOL */


#ground{

position:absolute;

bottom:35px;

height:5px;

width:100%;

background:#444;

}



/* CAPYBARA */


#capybara{

position:absolute;

width:90px;

height:60px;

bottom:40px;

left:90px;

}

  #capybara{

animation:courir .3s infinite alternate;

}
#capybara,
#score,
#ground,
#message{

z-index:5;

}

@keyframes courir{

from{
transform:translateY(0);
}

to{
transform:translateY(4px);
}

}


/* corps */

.body{

position:absolute;

width:65px;

height:45px;

background:#9b633b;

border-radius:40px;

bottom:5px;

}



/* tête */


.head{

position:absolute;

width:40px;

height:35px;

background:#9b633b;

right:0;

top:5px;

border-radius:50%;

}


/* nez */


.nose{

position:absolute;

right:-10px;

top:17px;

width:15px;

height:10px;

background:#222;

border-radius:50%;

}



/* oeil */


.eye{

position:absolute;

right:15px;

top:12px;

width:7px;

height:7px;

background:black;

border-radius:50%;

}


/* oreilles */


.ear{

position:absolute;

width:12px;

height:12px;

background:#6b4327;

border-radius:50%;

top:-5px;

}


.ear1{

right:25px;

}


.ear2{

right:10px;

}



/* pattes */


.leg{

position:absolute;

width:12px;

height:18px;

background:#6b4327;

bottom:-10px;

border-radius:10px;

}


.leg1{

left:15px;

}


.leg2{

right:20px;

}



/* cactus */


.cactus{

position:absolute;

bottom:40px;

left:900px;

width:14px;

height:30px;

background:#168000;

border-radius:5px;

}
.cactus::before{

content:"";

position:absolute;

width:8px;

height:15px;

background:#168000;

left:-7px;

top:10px;

border-radius:5px;

}
/* message */


#message{

display:none;

position:absolute;

top:100px;

width:100%;

text-align:center;

font-size:40px;

font-weight:bold;

color:#222;

}


.dark #message{

color:white;

}



/* confettis */


.confetti{

position:absolute;

width:10px;

height:10px;

animation:fall 2s linear forwards;

}


@keyframes fall{

to{

transform:translateY(400px) rotate(720deg);

}

}
/* FEE */

.fee{

position:absolute;

font-size:35px;

z-index:3;

}


/* ETOILES */

.star{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

z-index:1;

}
/* ===== PAYSAGE ===== */


/* arbres */

.tree{

position:absolute;

bottom:40px;

width:25px;

height:70px;

background:#8b4513;

border-radius:5px;

z-index:1;

}


.tree::before{

content:"";

position:absolute;

width:70px;

height:70px;

background:#228b22;

border-radius:50%;

left:-22px;

top:-35px;

}



/* fleurs */


.flower{

position:absolute;

bottom:45px;

font-size:20px;

z-index:2;

}



/* montagnes */


.mountain{

position:absolute;

bottom:40px;

width:200px;

height:100px;

background:#777;

clip-path:polygon(50% 0,100% 100%,0 100%);

z-index:0;

}
/* CAPYBARA COURSE */

#capybara.step .leg1{

transform:rotate(25deg);

}


#capybara.step .leg2{

transform:rotate(-25deg);

}



/* POUSSIERE */

.dust{

position:absolute;

width:8px;

height:8px;

background:#c2b280;

border-radius:50%;

animation:dust 0.6s forwards;

z-index:1;

}


@keyframes dust{


from{

transform:scale(1);

opacity:1;

}


to{

transform:translateX(-30px) scale(0);

opacity:0;

}


}




/* LUNE */


.moon{

display:none;

position:absolute;

right:80px;

top:40px;

width:60px;

height:60px;

background:#fff;

border-radius:50%;

box-shadow:0 0 30px white;

}


.dark .moon{

display:block;

}



/* VICTOIRE */


@keyframes victory{


0%{

transform:scale(1);

}


50%{

transform:scale(1.02);

}


100%{

transform:scale(1);

}


}  
</style>

</head>


<body>


<div id="menu">

<div id="box">

<h1>Choisis ton capybara 🐹</h1>

<button onclick="start('#9b633b')">
Marron clair
</button>

<button onclick="start('#777')">
Gris
</button>

<button onclick="start('#4b2e18')">
Marron foncé
</button>


</div>

</div>


<div id="game">


<div id="score">
Distance : 0
</div>


<div id="capybara">

<div class="body"></div>

<div class="head"></div>

<div class="eye"></div>

<div class="nose"></div>

<div class="ear ear1"></div>

<div class="ear ear2"></div>

<div class="leg leg1"></div>

<div class="leg leg2"></div>

</div>


<div id="ground"></div>


<div id="message"></div>


</div>

  <script>


let capy = document.getElementById("capybara");
let game = document.getElementById("game");
let scoreText = document.getElementById("score");
let message = document.getElementById("message");


let score = 0;
let speed = 6;
let alive = true;
let jumping = false;
let capyColor = "#9b633b";


// DEMARRAGE DU JEU

function start(color){

capyColor = color;

document.querySelector(".body").style.background=color;
document.querySelector(".head").style.background=color;


document.getElementById("menu").style.display="none";

game.style.display="block";


if(alive){

createCactus();

createCloud();

startLandscape();

startEffects();  

}

}

// SAUT

function jump(){


if(!alive || jumping)return;


jumping=true;
capy.style.animation="none";

let height=0;


let up=setInterval(()=>{


height+=10;


capy.style.bottom=40+height+"px";



if(height>=140){


clearInterval(up);



let down=setInterval(()=>{


height-=10;


capy.style.bottom=40+height+"px";



if(height<=0){


clearInterval(down);

capy.style.bottom="40px";

jumping=false;

capy.style.animation="courir .3s infinite alternate";

}



},20);



}


},20);



}



document.addEventListener("keydown",function(e){


if(e.code==="Space"){

jump();

}


});


game.onclick=jump;





// CREATION DES CACTUS


function createCactus(){


if(!alive)return;



let cactus=document.createElement("div");


cactus.className="cactus";
randomCactusSize(cactus);

game.appendChild(cactus);



let position=900;



let move=setInterval(()=>{


position-=speed;


cactus.style.left=position+"px";



let player=capy.getBoundingClientRect();

let obstacle=cactus.getBoundingClientRect();




if(

player.left < obstacle.right &&

player.right > obstacle.left &&

player.bottom > obstacle.top

){


gameOver();


}




if(position < -50){



clearInterval(move);

cactus.remove();



score++;



speed+=0.15;



scoreText.innerHTML="Distance : "+score;

if(score === 80){
    createFee();
}
changeTime();
// MODE SOMBRE

if(score==50){


document.body.classList.add("dark");


}



// VICTOIRE

if(score>=150){


win();


}



}



},20);



let temps=Math.random()*1500+1000;


setTimeout(createCactus,temps);


}





/* =========================
        PARTIE 3.1
========================= */


// 🧚 CREATION DES FEES

let feeStarted = false;


function createFee(){

if(!alive) return;


let fee = document.createElement("div");

fee.className="fee";

fee.innerHTML="🧚";

game.appendChild(fee);



let position=900;


// hauteur aléatoire dans les airs

let hauteur = Math.random()*120 + 100;

fee.style.bottom = hauteur+"px";



let move=setInterval(()=>{


position -= speed;


fee.style.left = position+"px";



// collision avec le capybara

let player = capy.getBoundingClientRect();

let obstacle = fee.getBoundingClientRect();



if(

player.left < obstacle.right &&

player.right > obstacle.left &&

player.top < obstacle.bottom &&

player.bottom > obstacle.top

){

gameOver();

}



if(position < -50){


clearInterval(move);

fee.remove();


}



},20);



// prochaine fée

if(alive){

setTimeout(createFee,Math.random()*4000+3000);

}


}




// 🌅 TRANSITION JOUR / NUIT


function changeTime(){


if(score >= 120){


document.body.style.background="#111";


game.style.background=

"linear-gradient(#111,#222)";



// étoiles

createStars();


}

else if(score >= 100){


game.style.background=

"linear-gradient(#ff9966,#444)";


}


}





// ⭐ CREATION DES ETOILES


function createStars(){


for(let i=0;i<40;i++){


let star=document.createElement("div");


star.className="star";


star.style.left=Math.random()*900+"px";

star.style.top=Math.random()*150+"px";


game.appendChild(star);


}


}





// 🌵 CACTUS ALEATOIRES


function randomCactusSize(cactus){


let taille=Math.random();


if(taille < 0.5){


cactus.style.height="25px";

cactus.style.width="10px";


}

else{


cactus.style.height="45px";

cactus.style.width="15px";


}



}

    // NUAGE


function createCloud(){


let cloud=document.createElement("div");


cloud.style.position="absolute";

cloud.style.width="90px";

cloud.style.height="35px";

cloud.style.background="white";

cloud.style.borderRadius="50px";

cloud.style.top=Math.random()*100+"px";

cloud.style.left="900px";


game.appendChild(cloud);



let x=900;



let move=setInterval(()=>{


x-=2;


cloud.style.left=x+"px";



if(x<-120){


cloud.remove();

clearInterval(move);


}



},20);



setTimeout(createCloud,3000);



}



/* =========================
        PARTIE 3.2
   PAYSAGE QUI DEFILENT
========================= */


// 🌲 CREATION DES ARBRES


function createTree(){


if(!alive) return;


let tree=document.createElement("div");

tree.className="tree";

game.appendChild(tree);



let position=900;


tree.style.left=position+"px";



let taille=Math.random()*30+50;

tree.style.height=taille+"px";



let move=setInterval(()=>{


position-=speed/2;


tree.style.left=position+"px";



if(position<-80){


clearInterval(move);

tree.remove();


}



},20);



if(alive){

setTimeout(createTree,Math.random()*4000+3000);

}


}





// 🌼 CREATION DES FLEURS


function createFlower(){


if(!alive)return;



let flower=document.createElement("div");


flower.className="flower";


flower.innerHTML="🌼";


game.appendChild(flower);



let position=900;


let move=setInterval(()=>{


position-=speed;


flower.style.left=position+"px";



if(position<-50){


flower.remove();

clearInterval(move);


}


},20);



if(alive){

setTimeout(createFlower,Math.random()*3000+2000);

}


}





// ⛰️ MONTAGNES EN ARRIERE PLAN


function createMountain(){


let mountain=document.createElement("div");


mountain.className="mountain";


game.appendChild(mountain);


let position=900;


let move=setInterval(()=>{


position-=speed/3;


mountain.style.left=position+"px";



if(position<-250){


mountain.remove();

clearInterval(move);


}



},20);



}





// 🌳 LANCEMENT DU PAYSAGE


function startLandscape(){


createTree();

createFlower();

createMountain();


}
/* =========================
        PARTIE 3.3
 CAPYBARA + NUIT + EFFETS
========================= */



// 🐹 ANIMATION DE COURSE


function animateCapy(){


if(!alive)return;


capy.classList.toggle("step");


setTimeout(animateCapy,250);


}





// 💨 POUSSIERE


function createDust(){


if(!alive)return;



let dust=document.createElement("div");


dust.className="dust";


game.appendChild(dust);



let x=capy.offsetLeft;


let y=capy.offsetTop+45;



dust.style.left=x+"px";

dust.style.top=y+"px";



setTimeout(()=>{

dust.remove();

},600);



}





// LANCEMENT POUSSIERE


setInterval(()=>{


if(alive){

createDust();

}


},300);





// 🌙 CREATION DE LA LUNE


function createMoon(){


let moon=document.createElement("div");


moon.className="moon";


game.appendChild(moon);



}






// ⭐ ETOILES ANIMEES


function animateStars(){


let stars=document.querySelectorAll(".star");


stars.forEach(star=>{


star.style.opacity=

Math.random();



});


}



setInterval(()=>{


animateStars();


},500);





// 🎉 VICTOIRE AMELIOREE


function victoryEffect(){


game.style.animation="victory 1s infinite";


}





// DEMARRAGE DES EFFETS


function startEffects(){


animateCapy();


createMoon();


}
// FIN DU JEU


function gameOver(){


alive=false;

capy.style.animation="none";

capy.style.transform="rotate(90deg)";


message.style.display="block";

message.innerHTML=


"💀 GAME OVER 💀<br><br>"+

"Distance : "+score+

"<br><br>"+

"<button onclick='restart()'>Rejouer</button>";



saveScore();


}





// VICTOIRE


function win(){


alive=false;


message.style.display="block";


message.innerHTML=


"🎉 VICTOIRE 🎉<br><br>"+

"Ton capybara est champion !";



createConfetti();


}





// CONFETTIS


function createConfetti(){



for(let i=0;i<150;i++){



let c=document.createElement("div");


c.className="confetti";


c.style.left=Math.random()*900+"px";


c.style.top="0px";


c.style.background=

"hsl("+Math.random()*360+",100%,50%)";



game.appendChild(c);



}



}





// MEILLEUR SCORE


function saveScore(){


let best=localStorage.getItem("best");


if(!best || score>best){


localStorage.setItem("best",score);


}


}





function restart(){

location.reload();

}



</script>


</body>

</html>
