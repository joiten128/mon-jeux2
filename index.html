<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Capybara Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#e8e8e8;

overflow:hidden;

transition:1s;

}


body.dark{

background:#111;

}


/* MENU COULEUR */

#menu{

position:absolute;

width:100%;
height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#87ceeb;

z-index:10;

}


#box{

background:white;

padding:30px;

border-radius:20px;

text-align:center;

}


#box h1{

margin-bottom:20px;

}


button{

padding:12px 20px;

margin:8px;

border:0;

border-radius:10px;

cursor:pointer;

font-size:18px;

}



/* JEU */


#game{

display:none;

width:900px;

height:350px;

margin:40px auto;

background:linear-gradient(#87ceeb,#eee);

border:3px solid #333;

border-radius:15px;

position:relative;

overflow:hidden;

}



.dark #game{

background:linear-gradient(#111,#333);

border-color:white;

}



/* SCORE */


#score{

position:absolute;

right:20px;

top:15px;

font-size:24px;

font-weight:bold;

}



/* SOL */


#ground{

position:absolute;

bottom:35px;

height:5px;

width:100%;

background:#444;

}



/* CAPYBARA */


#capybara{

position:absolute;

width:90px;

height:60px;

bottom:40px;

left:90px;

}
#capybara{

animation:courir .3s infinite alternate;

}


@keyframes courir{

from{
transform:translateY(0);
}

to{
transform:translateY(4px);
}

}


/* corps */

.body{

position:absolute;

width:65px;

height:45px;

background:#9b633b;

border-radius:40px;

bottom:5px;

}



/* tête */


.head{

position:absolute;

width:40px;

height:35px;

background:#9b633b;

right:0;

top:5px;

border-radius:50%;

}


/* nez */


.nose{

position:absolute;

right:-10px;

top:17px;

width:15px;

height:10px;

background:#222;

border-radius:50%;

}



/* oeil */


.eye{

position:absolute;

right:15px;

top:12px;

width:7px;

height:7px;

background:black;

border-radius:50%;

}


/* oreilles */


.ear{

position:absolute;

width:12px;

height:12px;

background:#6b4327;

border-radius:50%;

top:-5px;

}


.ear1{

right:25px;

}


.ear2{

right:10px;

}



/* pattes */


.leg{

position:absolute;

width:12px;

height:18px;

background:#6b4327;

bottom:-10px;

border-radius:10px;

}


.leg1{

left:15px;

}


.leg2{

right:20px;

}



/* cactus */


.cactus{

position:absolute;

bottom:40px;

left:900px;

width:22px;

height:45px;

background:#168000;

border-radius:7px;

}

/* message */


#message{

display:none;

position:absolute;

top:100px;

width:100%;

text-align:center;

font-size:40px;

font-weight:bold;

color:#222;

}


.dark #message{

color:white;

}



/* confettis */


.confetti{

position:absolute;

width:10px;

height:10px;

animation:fall 2s linear forwards;

}


@keyframes fall{

to{

transform:translateY(400px) rotate(720deg);

}

}


</style>

</head>


<body>


<div id="menu">

<div id="box">

<h1>Choisis ton capybara 🐹</h1>

<button onclick="start('#9b633b')">
Marron clair
</button>

<button onclick="start('#777')">
Gris
</button>

<button onclick="start('#4b2e18')">
Marron foncé
</button>


</div>

</div>


<div id="game">


<div id="score">
Distance : 0
</div>


<div id="capybara">

<div class="body"></div>

<div class="head"></div>

<div class="eye"></div>

<div class="nose"></div>

<div class="ear ear1"></div>

<div class="ear ear2"></div>

<div class="leg leg1"></div>

<div class="leg leg2"></div>

</div>


<div id="ground"></div>


<div id="message"></div>


</div>

  <script>


let capy = document.getElementById("capybara");
let game = document.getElementById("game");
let scoreText = document.getElementById("score");
let message = document.getElementById("message");


let score = 0;
let speed = 6;
let alive = true;
let jumping = false;
let capyColor = "#9b633b";


// DEMARRAGE DU JEU

function start(color){

capyColor = color;

document.querySelector(".body").style.background=color;
document.querySelector(".head").style.background=color;


document.getElementById("menu").style.display="none";

game.style.display="block";


if(alive){

createCactus();

createCloud();


}

}

// SAUT

function jump(){


if(!alive || jumping)return;


jumping=true;
capy.style.animation="none";

let height=0;


let up=setInterval(()=>{


height+=10;


capy.style.bottom=40+height+"px";



if(height>=140){


clearInterval(up);



let down=setInterval(()=>{


height-=10;


capy.style.bottom=40+height+"px";



if(height<=0){


clearInterval(down);

capy.style.bottom="40px";

jumping=false;

capy.style.animation="courir .3s infinite alternate";

}



},20);



}


},20);



}



document.addEventListener("keydown",function(e){


if(e.code==="Space"){

jump();

}


});


game.onclick=jump;





// CREATION DES CACTUS


function createCactus(){


if(!alive)return;



let cactus=document.createElement("div");


cactus.className="cactus";


game.appendChild(cactus);



let position=900;



let move=setInterval(()=>{


position-=speed;


cactus.style.left=position+"px";



let player=capy.getBoundingClientRect();

let obstacle=cactus.getBoundingClientRect();




if(

player.left < obstacle.right &&

player.right > obstacle.left &&

player.bottom > obstacle.top

){


gameOver();


}




if(position < -50){



clearInterval(move);

cactus.remove();



score++;



speed+=0.15;



scoreText.innerHTML="Distance : "+score;



// MODE SOMBRE

if(score==50){


document.body.classList.add("dark");


}



// VICTOIRE

if(score>=150){


win();


}



}



},20);



let temps=Math.random()*1500+1000;


setTimeout(createCactus,temps);


}






// NUAGE


function createCloud(){


let cloud=document.createElement("div");


cloud.style.position="absolute";

cloud.style.width="90px";

cloud.style.height="35px";

cloud.style.background="white";

cloud.style.borderRadius="50px";

cloud.style.top=Math.random()*100+"px";

cloud.style.left="900px";


game.appendChild(cloud);



let x=900;



let move=setInterval(()=>{


x-=2;


cloud.style.left=x+"px";



if(x<-120){


cloud.remove();

clearInterval(move);


}



},20);



setTimeout(createCloud,3000);



}





// FIN DU JEU


function gameOver(){


alive=false;

capy.style.animation="none";

capy.style.transform="rotate(90deg)";


message.style.display="block";

message.innerHTML=


"💀 GAME OVER 💀<br><br>"+

"Distance : "+score+

"<br><br>"+

"<button onclick='restart()'>Rejouer</button>";



saveScore();


}





// VICTOIRE


function win(){


alive=false;


message.style.display="block";


message.innerHTML=


"🎉 VICTOIRE 🎉<br><br>"+

"Ton capybara est champion !";



createConfetti();


}





// CONFETTIS


function createConfetti(){



for(let i=0;i<150;i++){



let c=document.createElement("div");


c.className="confetti";


c.style.left=Math.random()*900+"px";


c.style.top="0px";


c.style.background=

"hsl("+Math.random()*360+",100%,50%)";



game.appendChild(c);



}



}





// MEILLEUR SCORE


function saveScore(){


let best=localStorage.getItem("best");


if(!best || score>best){


localStorage.setItem("best",score);


}


}





function restart(){

location.reload();

}



</script>


</body>

</html>
