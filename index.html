<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<title>Capybara Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#e9e9e9;
font-family:Arial;
overflow:hidden;
transition:1s;

}


body.dark{

background:#111;

}


#game{

width:900px;
height:350px;

margin:40px auto;

background:linear-gradient(#87ceeb,#f5f5f5);

border:3px solid #333;

border-radius:15px;

position:relative;

overflow:hidden;

}


.dark #game{

background:linear-gradient(#111,#333);

border-color:white;

}



/* SCORE */

#score{

position:absolute;

right:20px;
top:15px;

font-size:25px;

font-weight:bold;

}



/* SOL */

#ground{

position:absolute;

bottom:35px;

height:5px;

width:100%;

background:#444;

}




/* CAPYBARA */


#capybara{

position:absolute;

bottom:40px;

left:90px;

width:70px;

height:45px;

background:#9b633b;

border-radius:40px 45px 25px 25px;

animation:run .3s infinite alternate;

}



@keyframes run{

from{

transform:translateY(0);

}

to{

transform:translateY(3px);

}

}



/* tête */

#capybara::before{

content:"";

position:absolute;

right:-25px;

top:5px;

width:38px;

height:35px;

background:#9b633b;

border-radius:50%;

}



/* museau */

#capybara::after{

content:"";

position:absolute;

right:-38px;

top:20px;

width:18px;

height:12px;

background:#222;

border-radius:50%;

}



/* oreilles */

.ear{

position:absolute;

width:12px;

height:12px;

background:#6e4529;

border-radius:50%;

top:-5px;

}



.ear.one{

right:15px;

}



.ear.two{

right:30px;

}



/* oeil */

.eye{

position:absolute;

right:3px;

top:12px;

width:7px;

height:7px;

background:black;

border-radius:50%;

}



/* pattes */

.leg{

position:absolute;

bottom:-10px;

width:12px;

height:18px;

background:#6e4529;

border-radius:10px;

}


.leg.one{

left:15px;

}


.leg.two{

right:15px;

}



/* CACTUS */


.cactus{

position:absolute;

bottom:40px;

width:35px;

height:70px;

background:#168000;

border-radius:10px;

}


.cactus:before{

content:"";

position:absolute;

width:15px;

height:30px;

background:#168000;

left:-12px;

top:25px;

border-radius:10px;

}


.cactus:after{

content:"";

position:absolute;

width:15px;

height:25px;

background:#168000;

right:-10px;

top:10px;

border-radius:10px;

}



/* NUAGES */

.cloud{

position:absolute;

background:white;

width:90px;

height:35px;

border-radius:50px;

top:60px;

opacity:.8;

}




/* MESSAGE */


#message{

display:none;

position:absolute;

top:100px;

width:100%;

text-align:center;

font-size:38px;

font-weight:bold;

color:#222;

}


.dark #message{

color:white;

}



button{

padding:12px 25px;

font-size:20px;

border:none;

border-radius:10px;

cursor:pointer;

}



/* confettis */


.confetti{

position:absolute;

width:10px;

height:10px;

animation:fall 2s linear forwards;

}


@keyframes fall{

to{

transform:translateY(400px) rotate(720deg);

}

}


</style>

</head>



<body>


<div id="game">


<div id="score">

Distance : 0

</div>


<div id="capybara">

<div class="eye"></div>

<div class="ear one"></div>

<div class="ear two"></div>

<div class="leg one"></div>

<div class="leg two"></div>

</div>


<div id="ground"></div>


<div id="message"></div>


</div>



<script>


let capy=document.getElementById("capybara");

let game=document.getElementById("game");

let scoreBox=document.getElementById("score");

let message=document.getElementById("message");


let score=0;

let speed=6;

let alive=true;



// SAUT


function jump(){


if(!alive)return;


if(capy.classList.contains("jump"))return;


capy.classList.add("jump");


capy.style.animation="none";


let h=0;


let up=setInterval(()=>{


h+=10;

capy.style.bottom=40+h+"px";


if(h>=140){


clearInterval(up);


let down=setInterval(()=>{


h-=10;


capy.style.bottom=40+h+"px";


if(h<=0){


clearInterval(down);


capy.style.bottom="40px";

capy.style.animation="run .3s infinite alternate";


}


},20);


}


},20);


}



document.addEventListener("keydown",e=>{

if(e.code==="Space")jump();

});


game.onclick=jump;





// OBSTACLES


function createCactus(){


if(!alive)return;


let c=document.createElement("div");

c.className="cactus";

game.appendChild(c);


let x=900;


let move=setInterval(()=>{


x-=speed;

c.style.left=x+"px";



let a=capy.getBoundingClientRect();

let b=c.getBoundingClientRect();



if(

a.left<b.right&&

a.right>b.left&&

a.bottom>b.top

){

lose();

}



if(x<-60){


clearInterval(move);

c.remove();


score++;

speed+=0.12;


scoreBox.innerHTML="Distance : "+score;



if(score==50){

document.body.classList.add("dark");

}


if(score>=150){

win();

}


}


},20);



setTimeout(createCactus,1200);

}


createCactus();





// NUAGES


function createCloud(){


let c=document.createElement("div");

c.className="cloud";

c.style.left="900px";

game.appendChild(c);


let x=900;


let move=setInterval(()=>{


x-=2;

c.style.left=x+"px";


if(x<-100){

c.remove();

clearInterval(move);

}


},20);



setTimeout(createCloud,4000);


}


createCloud();





function lose(){


alive=false;


message.style.display="block";


message.innerHTML=

"💀 GAME OVER 💀<br><br>"+

"Distance : "+score+

"<br><br><button onclick='restart()'>Rejouer</button>";

}




function win(){


alive=false;


message.style.display="block";


message.innerHTML=

"🎉 VICTOIRE 🎉<br><br>"+

"Le capybara est champion !";


for(let i=0;i<100;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*900+"px";

c.style.background=
"hsl("+Math.random()*360+",100%,50%)";


game.appendChild(c);


}


}



function restart(){

location.reload();

}


</script>


</body>

</html>
