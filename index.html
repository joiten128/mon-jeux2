<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dino Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eeeeee;
font-family:Arial;
overflow:hidden;
transition:1s;
}

body.dark{
background:#111;
}

#game{

width:900px;
height:350px;

background:linear-gradient(#fff,#eee);

border:3px solid #222;

margin:40px auto;

position:relative;

overflow:hidden;

border-radius:10px;

}

.dark #game{
background:linear-gradient(#111,#333);
border-color:white;
}


#score{

position:absolute;
top:15px;
right:20px;

font-size:25px;
font-weight:bold;

}


#dino{

position:absolute;

width:45px;
height:55px;

background:#333;

bottom:40px;
left:80px;

border-radius:8px;

}



#dino:after{

content:"";

position:absolute;

width:10px;
height:10px;

background:white;

right:8px;
top:10px;

border-radius:50%;

}


.jump{

animation:jump .7s;

}


@keyframes jump{

0%{bottom:40px}

50%{bottom:170px}

100%{bottom:40px}

}



.cactus{

position:absolute;

bottom:40px;

width:35px;

height:70px;

background:#168000;

border-radius:5px;

}


.cactus:before{

content:"";

position:absolute;

width:15px;
height:30px;

background:#168000;

left:-12px;
top:25px;

}


#ground{

position:absolute;

bottom:35px;

height:5px;

width:100%;

background:#222;

}



.cloud{

position:absolute;

top:50px;

width:80px;

height:30px;

background:white;

border-radius:30px;

opacity:.8;

}



#message{

display:none;

position:absolute;

top:110px;

width:100%;

text-align:center;

font-size:40px;

font-weight:bold;

}



button{

padding:12px 25px;

font-size:20px;

border:0;

border-radius:10px;

cursor:pointer;

}



.confetti{

position:absolute;

width:10px;
height:10px;

animation:fall 2s linear;

}



@keyframes fall{

to{

transform:translateY(400px) rotate(360deg);

}

}



</style>

</head>


<body>


<div id="game">


<div id="score">
Distance : 0
</div>


<div id="dino"></div>


<div id="ground"></div>


<div id="message">

GAME OVER 😵<br>

<button onclick="restart()">
Rejouer
</button>

</div>


</div>



<script>


let dino=document.querySelector("#dino");

let game=document.querySelector("#game");

let scoreText=document.querySelector("#score");

let message=document.querySelector("#message");


let score=0;

let speed=6;

let alive=true;



// saut

function jump(){

if(!alive)return;

if(!dino.classList.contains("jump")){

dino.classList.add("jump");

setTimeout(()=>{

dino.classList.remove("jump");

},700);

}

}


document.addEventListener("keydown",e=>{

if(e.code=="Space")jump();

});


game.onclick=jump;



// nuages

function cloud(){

let c=document.createElement("div");

c.className="cloud";

c.style.left="900px";

game.appendChild(c);


let x=900;


let move=setInterval(()=>{

x-=2;

c.style.left=x+"px";


if(x<-100){

clearInterval(move);

c.remove();

}

},20);


setTimeout(cloud,3000);

}

cloud();




// cactus


function cactus(){


if(!alive)return;


let c=document.createElement("div");

c.className="cactus";

game.appendChild(c);


let x=900;


let move=setInterval(()=>{


x-=speed;

c.style.left=x+"px";



let d=dino.getBoundingClientRect();

let o=c.getBoundingClientRect();



if(

d.left<o.right &&

d.right>o.left &&

d.bottom>o.top

){

gameOver();

}



if(x<-50){

c.remove();

clearInterval(move);

score++;

speed+=0.15;


scoreText.innerHTML="Distance : "+score;


if(score==50){

document.body.classList.add("dark");

}



if(score>=100){

win();

}


}


},20);



setTimeout(cactus,1200);

}


cactus();




// fin


function gameOver(){

alive=false;

message.style.display="block";

message.innerHTML=

"GAME OVER 😵<br><br>"+

"Score : "+score+

"<br><br><button onclick='restart()'>Rejouer</button>";

}




function win(){

alive=false;

message.style.display="block";


message.innerHTML=

"VICTOIRE 🎉🏆<br><br>"+

"100 mètres parcourus !";


confetti();

}




function confetti(){

for(let i=0;i<100;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*900+"px";

c.style.top="0px";

c.style.background=
"hsl("+Math.random()*360+",100%,50%)";


game.appendChild(c);


}

}




function restart(){

location.reload();

}


</script>


</body>
</html>
